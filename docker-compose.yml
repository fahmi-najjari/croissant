services:
  backend:                         # Define the "backend" service (your Django app)
    build: .                   # Build the image using the Dockerfile in the current folder
    ports:
      - "8000:8000"            # Map container port 8000 to local port 8000 (visit http://localhost:8000)
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000  # Run Django’s development server, listening on all interfaces
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
                       
volumes:
  postgres_data: